<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konrad Gourmet — Iniciar sesión</title>
<link rel="icon" href="assets/logo/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Fondo: video 3D ===== -->
  <div class="stage">
    <video class="bg-video" autoplay muted loop playsinline poster="assets/logo/logo.png">
      <source src="assets/video/3DVideo.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <!-- Formas decorativas naranjas -->
    <span class="deco deco--square"></span>
    <span class="deco deco--glow"></span>

    <!-- ===== Tarjeta de login ===== -->
    <main class="login-card">

      <!-- Marca -->
      <header class="brand">
        <img class="brand__logo" src="assets/logo/logo.png" alt="Konrad Gourmet">
        <div class="brand__text">
          <h1 class="brand__name"><span>Konrad</span> <strong>Gourmet</strong></h1>
          <p class="brand__tagline">Sistema de Abastecimiento</p>
        </div>
      </header>

      <!-- Bienvenida -->
      <h2 class="welcome">¡Bien<span>venido!</span></h2>
      <p class="welcome__sub">Inicia sesión para continuar</p>

      <!-- Formulario -->
      <form class="form" action="#" method="post" autocomplete="on">

        <div class="field">
          <label class="field__label" for="email">Correo electrónico</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="4.5" width="19" height="15" rx="3"/>
                <path d="m3.5 7 7.4 5.3a2 2 0 0 0 2.2 0L20.5 7"/>
              </svg>
            </span>
            <input id="email" name="email" type="email" placeholder="tu@konradgourmet.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="3"/>
                <path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
                <circle cx="12" cy="15.5" r="1.4"/>
              </svg>
            </span>
            <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button class="input-toggle" type="button" aria-label="Mostrar contraseña" data-toggle-password>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3 21 21"/>
                <path d="M10.6 6.3A8.9 8.9 0 0 1 12 6.2c4.6 0 8.1 3.6 9.3 5.3a1 1 0 0 1 0 1.1 17 17 0 0 1-2.7 2.9"/>
                <path d="M16.2 16.5A9.5 9.5 0 0 1 12 17.8c-4.6 0-8.1-3.6-9.3-5.3a1 1 0 0 1 0-1.1A17.6 17.6 0 0 1 6 7.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.7 12.4a1 1 0 0 1 0-1.1C3.9 9.6 7.4 6 12 6s8.1 3.6 9.3 5.3a1 1 0 0 1 0 1.1C20.1 14.2 16.6 17.8 12 17.8s-8.1-3.6-9.3-5.4Z"/>
                <circle cx="12" cy="11.9" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form__row">
          <label class="check">
            <input type="checkbox" name="remember" checked>
            <span class="check__box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12.5 4.5 4.5L19 7"/>
              </svg>
            </span>
            <span class="check__label">Recordarme</span>
          </label>
          <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="btn-login" type="submit">
          <span>Iniciar sesión</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h15"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </button>

      </form>
    </main>
  </div>

<script>
  // Único toque de JS: mostrar / ocultar la contraseña
  document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = btn.parentElement.querySelector('input');
      var shown = input.type === 'text';
      input.type = shown ? 'password' : 'text';
      btn.classList.toggle('is-visible', !shown);
      btn.setAttribute('aria-label', shown ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });
  });
</script>
</body>
</html>
